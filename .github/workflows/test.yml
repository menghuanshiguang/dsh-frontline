# Only the portable half runs here: smoke (fake registry) and contract (text).
# integration and lifecycle need the host's own `@deepseek-ai/*` packages, which
# a bare checkout does not carry; they stay a local check (`npm test`).
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/smoke.mjs
      - run: node test/contract.mjs
