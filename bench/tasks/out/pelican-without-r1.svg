<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6ff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8b8"/>
      <stop offset="100%" stop-color="#a9d18a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="400" cy="560" rx="480" ry="110" fill="url(#ground)"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="110" rx="60" ry="26"/>
    <ellipse cx="185" cy="100" rx="45" ry="22"/>
    <ellipse cx="100" cy="120" rx="40" ry="18"/>
    <ellipse cx="640" cy="80" rx="55" ry="24"/>
    <ellipse cx="690" cy="72" rx="40" ry="20"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="520" rx="230" ry="26" fill="#000000" opacity="0.10"/>

  <!-- bicycle -->
  <g stroke="#2b2b2b" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- rear wheel -->
    <circle cx="270" cy="470" r="70" stroke="#222222" stroke-width="12"/>
    <!-- front wheel -->
    <circle cx="560" cy="470" r="70" stroke="#222222" stroke-width="12"/>
    <!-- spokes -->
    <g stroke-width="4" stroke="#555555">
      <line x1="270" y1="400" x2="270" y2="540"/>
      <line x1="200" y1="470" x2="340" y2="470"/>
      <line x1="220" y1="420" x2="320" y2="520"/>
      <line x1="320" y1="420" x2="220" y2="520"/>
      <line x1="560" y1="400" x2="560" y2="540"/>
      <line x1="490" y1="470" x2="630" y2="470"/>
      <line x1="510" y1="420" x2="610" y2="520"/>
      <line x1="610" y1="420" x2="510" y2="520"/>
    </g>
    <!-- frame -->
    <path d="M270 470 L400 470 L360 350 Z" stroke="#d94f4f" stroke-width="12"/>
    <path d="M360 350 L520 350 L560 470" stroke="#d94f4f" stroke-width="12"/>
    <path d="M400 470 L360 350" stroke="#d94f4f" stroke-width="12"/>
    <!-- seat post and seat -->
    <line x1="360" y1="350" x2="345" y2="300" stroke="#666666" stroke-width="10"/>
    <path d="M305 300 L385 300 L370 285 L320 285 Z" fill="#333333" stroke="#333333" stroke-width="6"/>
    <!-- handlebar -->
    <line x1="520" y1="350" x2="540" y2="280" stroke="#666666" stroke-width="10"/>
    <path d="M540 280 Q520 250 500 265" stroke="#333333" stroke-width="10"/>
    <path d="M540 280 Q560 250 580 262" stroke="#333333" stroke-width="10"/>
    <!-- pedals -->
    <circle cx="400" cy="470" r="14" fill="#999999" stroke="#444444" stroke-width="6"/>
    <line x1="400" y1="470" x2="430" y2="505" stroke="#444444" stroke-width="8"/>
    <rect x="420" y="500" width="26" height="12" rx="4" fill="#444444" stroke="#444444" stroke-width="4"/>
  </g>

  <!-- pelican -->
  <g>
    <!-- legs to pedals -->
    <g stroke="#f0a02a" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M368 395 L380 440 L430 505"/>
      <path d="M378 400 L400 455 L415 505"/>
    </g>
    <path d="M415 505 l-18 6" stroke="#f0a02a" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- tail -->
    <path d="M292 330 L235 300 L250 330 L232 348 L295 360 Z" fill="#e8e8e8" stroke="#c9c9c9" stroke-width="3"/>

    <!-- body -->
    <ellipse cx="360" cy="345" rx="88" ry="62" fill="#fbfbfb" stroke="#d8d8d8" stroke-width="3" transform="rotate(-8 360 345)"/>

    <!-- wing -->
    <path d="M330 320 Q390 300 415 340 Q400 390 350 400 Q315 375 330 320 Z" fill="#e4e4e4" stroke="#c6c6c6" stroke-width="3"/>
    <g stroke="#c6c6c6" stroke-width="3" fill="none">
      <path d="M350 330 Q375 335 395 355"/>
      <path d="M342 352 Q370 358 388 372"/>
      <path d="M336 372 Q360 378 372 388"/>
    </g>

    <!-- neck -->
    <path d="M415 315 Q470 260 455 195 Q450 165 425 155" fill="none" stroke="#fbfbfb" stroke-width="34" stroke-linecap="round"/>
    <path d="M415 315 Q470 260 455 195 Q450 165 425 155" fill="none" stroke="#d8d8d8" stroke-width="34" stroke-linecap="round" opacity="0.25"/>

    <!-- head -->
    <ellipse cx="418" cy="148" rx="42" ry="36" fill="#fbfbfb" stroke="#d8d8d8" stroke-width="3"/>

    <!-- eye -->
    <circle cx="432" cy="138" r="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <circle cx="434" cy="138" r="4" fill="#1a1a1a"/>
    <circle cx="436" cy="136" r="1.5" fill="#ffffff"/>

    <!-- pouch (throat) -->
    <path d="M448 158 Q505 175 530 150 Q520 205 470 210 Q440 205 435 180 Z" fill="#ffcb5c" stroke="#e0a83a" stroke-width="3"/>

    <!-- upper beak -->
    <path d="M448 140 Q520 138 548 152 Q530 162 505 160 Q475 158 452 158 Z" fill="#f7b731" stroke="#d99a1f" stroke-width="3"/>
    <circle cx="457" cy="144" r="2.5" fill="#c9861a"/>

    <!-- little crest -->
    <path d="M392 120 Q380 96 402 100 Q392 82 412 94" fill="none" stroke="#e0e0e0" stroke-width="5" stroke-linecap="round"/>

    <!-- feet on pedals highlighted -->
    <path d="M430 505 l20 2" stroke="#f0a02a" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- motion lines -->
  <g stroke="#8fbfe0" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="330" x2="190" y2="330"/>
    <line x1="100" y1="370" x2="180" y2="370"/>
    <line x1="130" y1="410" x2="195" y2="410"/>
  </g>
</svg>