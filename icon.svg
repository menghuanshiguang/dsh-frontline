<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Frontline: identity and engineering discipline">
  <defs>
    <linearGradient id="frontline-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffc4"/>
      <stop offset="0.55" stop-color="#4fd1a5"/>
      <stop offset="1" stop-color="#4f8bd1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e1720"/>
  <!-- identity: the shield that carries the name -->
  <path d="M32 9l17 6.5v13c0 11.4-7 20.6-17 25.5-10-4.9-17-14.1-17-25.5v-13L32 9z" fill="none" stroke="url(#frontline-shield)" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- discipline: the check that the claim was verified -->
